name: Windows Artifact

on:
  push:
    branches:
      - fix/windows-owner-identity
  workflow_dispatch:
    inputs:
      bundles:
        description: Tauri bundle targets to build
        required: false
        default: nsis,msi
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-artifact

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows bundles
        run: pnpm tauri:build:release -- --bundles ${{ inputs.bundles }}

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: cliv-windows-${{ github.run_id }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
