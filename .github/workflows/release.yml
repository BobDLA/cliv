name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_name: cliv-linux-x86_64
            bundle_ext: deb
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: cliv-macos-aarch64
            bundle_ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: cliv-windows-x86_64.exe
            bundle_ext: msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Prepare Linux assets
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.target }}/release/cliv release-assets/${{ matrix.asset_name }}
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb release-assets/

      - name: Prepare macOS assets
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/

      - name: Prepare Windows assets
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Copy-Item src-tauri/target/${{ matrix.target }}/release/cliv.exe release-assets/${{ matrix.asset_name }}
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
